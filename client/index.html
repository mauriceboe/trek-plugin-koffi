<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Koffi &amp; Friends</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100vh;
    overflow: hidden;
    background: transparent;
  }

  /* ---- shared mascot chassis: JS drives translate3d(x) on .mascot ---- */
  .mascot {
    position: absolute;
    left: 0;
    bottom: 0;
    will-change: transform;
    perspective: 340px; /* gives rotateY spins a little depth */
    pointer-events: none;
    --step: 0.72s;      /* stride duration, set per mood by the engine */
  }
  .mascot .jumper, .mascot .flip { position: absolute; inset: 0; }
  .mascot .jumper { transform-origin: 50% 100%; transition: bottom .45s cubic-bezier(.34,1.3,.64,1); }
  .mascot .flip   { transition: transform .26s ease; transform-origin: 50% 50%; }

  /* duet sparkles pop between two mascots (outside any flip, glyphs never mirror) */
  #stage-fx { position: absolute; inset: 0; pointer-events: none; }
  #stage-fx span {
    position: absolute;
    bottom: 58px;
    font: 700 13px/1 "Trebuchet MS", "Segoe UI", sans-serif;
    color: #FDE68A;
    text-shadow: 0 1px 2px rgba(30,27,75,.7);
    animation: sfxPop 1s ease-out forwards;
  }
  @keyframes sfxPop {
    0%   { opacity: 0; transform: translateY(6px)   scale(.4) rotate(-12deg); }
    18%  { opacity: 1; }
    100% { opacity: 0; transform: translateY(-22px) scale(1.25) rotate(14deg); }
  }

  /* ---- reduced motion: every character freezes in its static pose ---- */
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation: none !important; transition: none !important; }
  }
</style>
</head>
<body>

<div id="stage"></div>
<div id="stage-fx"></div>

<!-- build:inline-scripts:begin -->
<!-- engine.js -->
<script>
// Mascot engine — the character-agnostic half of what used to be Koffi's inline
// script. One Runtime per character on the stage (max two), each with its own
// weighted state machine, locomotion, blink/shine micro-loops and lane. A
// character is pure data + choreography (see characters/*.js): SVG markup, CSS,
// mood tables and per-state enter hooks. The engine owns time, movement and the
// class plumbing; characters own everything that makes them feel alive.
//
// Registration: each character file calls TrekMascots.register(def). The stage
// (index.html) decides which of them to spawn from the user's saved picks.
(function () {
  'use strict';

  var DEBUG = false;
  function log() { if (DEBUG && window.console) console.log.apply(console, ['[mascots]'].concat([].slice.call(arguments))); }

  function rand(a, b) { return a + Math.random() * (b - a); }
  function clamp(v, a, b) { return v < a ? a : (v > b ? b : v); }
  function pick(w) {
    var sum = 0, k;
    for (k in w) sum += w[k];
    var r = Math.random() * sum;
    for (k in w) { r -= w[k]; if (r <= 0) return k; }
    return 'idle';
  }

  var reduced = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;

  /**
   * One live character on the stage.
   *
   * def = {
   *   id, name, width, height,
   *   svg,                    // inner stage markup (svg + fx overlays)
   *   css,                    // stylesheet, selectors scoped under #m-<id>
   *   stateClasses: [...],    // every class setState must sweep
   *   config: { speed, step, dur, weights, sleepFromSit, waveEveryMs, rollBoost? },
   *   enter: { stateName: function (k) {...}, ... },
   *   moodFromTrip: function (days, ongoing) -> mood string,
   *   moods: ['chill', ...],  // valid moods (class mood-<m> is applied)
   *   reducedPose: 'pose-sit',// class(es) for the static reduced-motion pose
   *   glide: { state, boost, outClass, spinClass } | null,  // roll-style gliding state
   * }
   */
  function Runtime(def, stage, opts) {
    this.def = def;
    this.opts = opts || {};
    this.el = document.createElement('div');
    this.el.className = 'mascot';
    this.el.id = 'm-' + def.id;
    this.el.setAttribute('data-ch', def.id);
    this.el.style.width = def.width + 'px';
    this.el.style.height = def.height + 'px';
    this.el.innerHTML =
      (def.shadow || '') +
      '<div class="jumper"><div class="flip">' + def.svg + '</div></div>' +
      (def.fx || '');
    stage.appendChild(this.el);
    this.flip = this.el.querySelector('.flip');

    this.mood = def.moods[0];
    this.x = 0; this.dir = 1; this.vx = 0;
    this.minX = 6; this.maxX = 100;
    this.state = ''; this.walkTarget = null; this.afterWalk = null; this.forceNext = null;
    this.lastWave = performance.now();
    this.glideMoving = false; this.glideTucked = true;
    this.timers = [];
    this.booted = false;
    this.paused = false;          // director holds the FSM during a duet
    this.lastT = performance.now();
    this.lastTurnT = -1e9;
    this.tripDays = null; this.tripOngoing = false;
  }

  Runtime.prototype = {
    addC: function (c) { this.el.classList.add(c); },
    remC: function (c) { this.el.classList.remove(c); },
    hasC: function (c) { return this.el.classList.contains(c); },
    later: function (fn, ms) { var t = setTimeout(fn, ms); this.timers.push(t); return t; },
    clearTimers: function () {
      for (var i = 0; i < this.timers.length; i++) clearTimeout(this.timers[i]);
      this.timers.length = 0;
    },
    rand: rand,

    setLane: function (minX, maxX) {
      this.minX = minX;
      this.maxX = Math.max(minX, maxX);
      this.x = clamp(this.x, this.minX, this.maxX);
    },

    setDir: function (d) {
      if (this.booted && d !== this.dir && !reduced && this.def.onTurn) this.def.onTurn(this);
      this.dir = d;
      this.flip.style.transform = 'scaleX(' + (d < 0 ? -1 : 1) + ')';
      this.el.classList.toggle('flipped', d < 0); // counter-flips text glyphs
    },

    /** re-trigger a one-shot class (reflow-cycled) */
    pulse: function (c, ms) {
      var self = this;
      this.remC(c); void this.el.offsetWidth; this.addC(c);
      if (ms) setTimeout(function () { self.remC(c); }, ms);
    },

    chooseNext: function () {
      var def = this.def, cfg = def.config;
      var now = performance.now();
      if (def.afterState && def.afterState[this.state]) return def.afterState[this.state];
      if (cfg.waveEveryMs && now - this.lastWave > cfg.waveEveryMs && this.state !== 'wave') return 'wave';
      if (this.forceNext) { var f = this.forceNext; this.forceNext = null; return f; }
      if (this.state === 'sit') {
        return pick({ walk: 3, idle: 2, sleep: (cfg.sleepFromSit && cfg.sleepFromSit[this.mood]) || 0 });
      }
      var base = cfg.weights[this.mood], w = {}, k;
      for (k in base) if (base[k] > 0) w[k] = base[k];
      if (def.filterWeights) def.filterWeights(this, w);
      if (def.glide && this.maxX - this.minX < 130) delete w[def.glide.state]; // gliding needs runway
      if (this.state !== 'walk') delete w[this.state];  // no immediate repeats except walking
      return pick(w);
    },

    tuckGlide: function () {
      var g = this.def.glide;
      if (!g || this.glideTucked) return;
      this.glideTucked = true;
      this.glideMoving = false;
      this.remC(g.spinClass);
      this.remC(g.outClass);
      var self = this;
      this.later(function () { if (self.def.onGlideTuck) self.def.onGlideTuck(self); }, 150);
    },

    setState: function (name) {
      this.clearTimers();
      this.glideMoving = false;
      this.glideTucked = true;
      var sc = this.def.stateClasses;
      for (var i = 0; i < sc.length; i++) this.remC(sc[i]);

      // edge states walk over first when mid-strip (peek and friends)
      var edgeStates = this.def.edgeStates || {};
      if (edgeStates[name]) {
        var edge = (this.x - this.minX < this.maxX - this.x) ? this.minX : this.maxX;
        if (Math.abs(this.x - edge) > (this.def.config.edgeSnap || 34)) {
          this.walkTarget = edge;
          this.afterWalk = name;
          this.setDir(edge < this.x ? -1 : 1);
          this.state = 'walk';
          this.addC('st-walk');
          var self0 = this;
          this.later(function () { self0.end(); },
            Math.abs(this.x - edge) / this.def.config.speed[this.mood] * 1000 + 4000); // safety net
          return;
        }
      }

      this.state = name;
      this.walkTarget = null;
      this.addC('st-' + name);
      if (this.def.enter[name]) this.def.enter[name](this);
      var d = this.def.config.dur[name] || [2000, 3000];
      var self = this;
      this.later(function () { self.end(); }, rand(d[0], d[1]));
      log(this.def.id, 'state:', name, 'mood:', this.mood);
    },

    end: function () {
      if (this.paused) return; // director resumes us explicitly
      var q = this.afterWalk;
      this.afterWalk = null;
      this.setState(q || this.chooseNext());
    },

    /** director hooks: freeze/unfreeze the autonomous FSM */
    hold: function () { this.paused = true; this.clearTimers(); },
    release: function (nextState) {
      this.paused = false;
      this.onArrive = null;
      this.setState(nextState || this.chooseNext());
    },

    /**
     * Director-driven state: swap classes + run the enter hook, but never
     * auto-advance — the scene decides when this beat is over. skipEnter lets a
     * scene use the walk cycle without enter.walk's random direction flip.
     */
    play: function (name, opts) {
      this.clearTimers();
      var sc = this.def.stateClasses;
      for (var i = 0; i < sc.length; i++) this.remC(sc[i]);
      this.state = name;
      this.walkTarget = null;
      this.addC('st-' + name);
      if (!(opts && opts.skipEnter) && this.def.enter[name]) this.def.enter[name](this);
    },

    /** walk to an x position; resolves via onArrive while held by the director */
    walkTo: function (target, done) {
      this.play('walk', { skipEnter: true });
      this.setDir(target < this.x ? -1 : 1);
      this.walkTarget = target;
      this.onArrive = done;
    },

    tick: function (t) {
      var dt = Math.min(.05, (t - this.lastT) / 1000);
      this.lastT = t;
      var g = this.def.glide;
      var gliding = g && this.state === g.state && this.glideMoving;
      var moving = this.state === 'walk' || gliding;
      var tv = moving ? this.dir * this.def.config.speed[this.mood] * (gliding ? (g.boost || 1.5) : 1) : 0;
      this.vx += (tv - this.vx) * Math.min(1, dt * (moving ? 4.5 : 9));
      this.x = clamp(this.x + this.vx * dt, this.minX, this.maxX);
      if (this.state === 'walk') {
        if (this.walkTarget == null) {
          if (!this.paused) {
            // Early-turn only when the strip is wide enough for two pads, and never
            // twice within 500ms — a tiny lane otherwise flip-thrashes every frame.
            var tp = this.def.config.turnPad == null ? 20 : this.def.config.turnPad;
            var pad = this.maxX - this.minX > tp * 2 + 8 ? tp : 0;
            if (t - this.lastTurnT > 500) {
              if (this.dir < 0 && this.x <= this.minX + pad) { this.lastTurnT = t; this.setDir(1); }
              else if (this.dir > 0 && this.x >= this.maxX - pad) { this.lastTurnT = t; this.setDir(-1); }
            }
          }
        } else if (Math.abs(this.x - this.walkTarget) < 3 || this.x <= this.minX || this.x >= this.maxX) {
          this.walkTarget = null;
          if (this.paused && this.onArrive) {
            var cb = this.onArrive;
            this.onArrive = null;
            cb(this);
          } else {
            this.end();
          }
        }
      } else if (gliding) {
        if ((this.dir < 0 && this.x <= this.minX + 4) || (this.dir > 0 && this.x >= this.maxX - 4)) this.tuckGlide();
      }
      this.el.style.transform = 'translate3d(' + this.x.toFixed(2) + 'px,0,0)';
    },

    setMood: function (m) {
      var def = this.def;
      if (def.moods.indexOf(m) < 0) m = def.moods[0];
      var changed = m !== this.mood;
      this.mood = m;
      for (var i = 0; i < def.moods.length; i++) this.remC('mood-' + def.moods[i]);
      this.addC('mood-' + m);
      this.el.style.setProperty('--step', def.config.step[m]);
      if (def.onMood) def.onMood(this, m, changed);
      log(def.id, 'mood:', m);
    },

    applyTrip: function (days, ongoing) {
      this.tripDays = days;
      this.tripOngoing = ongoing;
      this.setMood(this.def.moodFromTrip(days, ongoing));
    },

    boot: function (laneMin, laneMax) {
      this.setLane(laneMin, laneMax);
      this.x = clamp(this.minX + (this.maxX - this.minX) * rand(.3, .7), this.minX, this.maxX);
      this.setDir(Math.random() < .5 ? -1 : 1);
      this.setMood(this.def.moods[0]);
      this.el.style.transform = 'translate3d(' + this.x.toFixed(2) + 'px,0,0)';
      this.booted = true;
      if (reduced) {
        var poses = (this.def.reducedPose || '').split(' ');
        for (var i = 0; i < poses.length; i++) if (poses[i]) this.addC(poses[i]);
        return;
      }
      // Blinking + specular shine live outside the FSM so they never stall.
      var self = this;
      (function blinkLoop() {
        setTimeout(function () {
          if (self.dead) return;
          if (self.state !== 'sleep' && !self.hasC('squint')) {
            self.pulse('blink', self.def.blinkMs || 130);
            if (Math.random() < .3) setTimeout(function () { self.pulse('blink', self.def.blinkMs || 130); }, 250);
          }
          blinkLoop();
        }, rand.apply(null, self.def.blinkEvery || [2300, 5600]));
      })();
      if (this.def.shineClasses && this.def.shineClasses.length) {
        (function shineLoop() {
          setTimeout(function () {
            if (self.dead) return;
            if (self.state !== 'sleep') {
              var cs = self.def.shineClasses;
              var c = cs[Math.floor(Math.random() * cs.length)];
              self.addC(c);
              setTimeout(function () { self.remC(c); }, 1100);
            }
            shineLoop();
          }, rand(9000, 22000));
        })();
      }
      if (this.def.ambient) this.def.ambient(this); // character-owned always-on loops
      this.setState('idle');
    },

    destroy: function () {
      this.dead = true;
      this.clearTimers();
      if (this.el.parentNode) this.el.parentNode.removeChild(this.el);
    }
  };

  var registry = {};
  var order = [];

  window.TrekMascots = {
    reduced: reduced,
    rand: rand,
    clamp: clamp,
    pick: pick,
    register: function (def) {
      if (!registry[def.id]) order.push(def.id);
      registry[def.id] = def;
      if (def.css) {
        var s = document.createElement('style');
        s.setAttribute('data-ch', def.id);
        s.textContent = def.css;
        document.head.appendChild(s);
      }
    },
    get: function (id) { return registry[id]; },
    ids: function () { return order.slice(); },
    Runtime: Runtime
  };
})();
</script>

<script>

(function () {
  'use strict';

  var CSS = "\n\n  /* ---- moving root: JS drives translate3d(x) ---- */\n\n#m-koffi .jumper, #m-koffi .flip { position: absolute; inset: 0; }\n#m-koffi .jumper { transform-origin: 50% 100%; }\n#m-koffi .flip { transition: transform .26s ease; transform-origin: 50% 50%; }\n\n#m-koffi .char {\n    display: block;\n    position: absolute;\n    left: 0;\n    bottom: 0;\n    overflow: visible;\n    /* rim: dark shadow + faint light halo so Koffi reads on any hero image */\n    filter: drop-shadow(0 1px 1px rgba(2,6,23,.35)) drop-shadow(0 0 1px rgba(248,250,252,.3));\n  }\n\n  /* ---- ground shadow ---- */\n#m-koffi .shadow {\n    position: absolute;\n    left: 50%;\n    bottom: 0;\n    margin-left: -33px;\n    opacity: .17;\n    filter: blur(1.1px);\n    transform-origin: 50% 100%;\n    transition: transform .4s ease, opacity .4s ease;\n  }\n#m-koffi.pose-sit #m-koffi .shadow { transform: scaleX(1.12); opacity: .21; }\n#m-koffi.roll-out #m-koffi .shadow { transform: scaleX(1.3); opacity: .2; }\n\n  /* ---- SVG group plumbing: CSS transforms in viewBox units ---- */\n  #kf-root, #kf-trunk, #kf-breathe, #kf-face, #kf-legL, #kf-legR, #kf-lid, #kf-tag, #kf-pupils, #kf-lids, #kf-armF, #kf-armB, #kf-map, #kf-postcard, #kf-tele, #kf-tagCard, #kf-stamp, #kf-stampAnim, #kf-puffS, #kf-squint { transform-box: view-box; }\n\n#kf-root { transform-origin: 32px 70px; transition: transform .55s cubic-bezier(.4,0,.3,1); }\n#kf-trunk { transform-origin: 32px 60px; transition: transform .48s cubic-bezier(.34,1.4,.64,1); }\n#kf-breathe { transform-origin: 32px 58px; animation: kfBreathe 3.4s ease-in-out infinite; }\n#kf-legL { transform-origin: 25px 53px; transition: transform .45s cubic-bezier(.34,1.4,.64,1); }\n#kf-legR { transform-origin: 39px 53px; transition: transform .45s cubic-bezier(.34,1.4,.64,1); }\n#kf-lid { transform-origin: 9px 29px;  transition: transform .35s cubic-bezier(.34,1.5,.64,1); }\n#kf-tag { transform-origin: 37.5px 16px; animation: kfTagIdle 3.8s ease-in-out infinite; }\n#kf-armF { transform-origin: 54.3px 38px; transform: rotate(-8deg); transition: transform .3s ease; }\n#kf-armB { transform-origin: 10.5px 38px; transform: rotate(8deg);  transition: transform .3s ease; }\n#kf-lids { transform-origin: 32px 35.4px; transform: scaleY(0); transition: transform .09s ease-out; }\n#kf-pupils { transition: transform .3s ease, opacity .12s ease; animation: kfDrift 9s ease-in-out infinite; }\n#kf-map { transform-origin: 36px 55px; transform: scale(.2,.06); opacity: 0;\n            transition: transform .55s cubic-bezier(.3,1.4,.4,1), opacity .2s ease; }\n#kf-postcard { transition: transform .5s cubic-bezier(.25,1.35,.4,1) .12s; }\n#kf-shades { transform: translateY(-15px); opacity: 0;\n            transition: transform .65s cubic-bezier(.34,1.56,.64,1) .1s, opacity .3s ease .1s; }\n#kf-flag { opacity: 0; transition: opacity .25s ease .25s; }\n\n  /* trolley kit: telescope handle + pop-out wheels, tucked by default */\n#kf-tele { transform-origin: 13px 20.5px; transform: scaleY(0);\n            transition: transform .16s cubic-bezier(.55,-.35,.65,1.2); }\n#m-koffi .wheel { transform: scale(0); transition: transform .18s cubic-bezier(.55,-.35,.65,1.2); }\n\n  /* split-flap tag card + unmirrored number */\n#kf-tagCard { transform-origin: 40.6px 26.3px; }\n#kf-tagNum { opacity: 0; transform-box: fill-box; transform-origin: center; transition: opacity .18s ease; }\n#kf-tagLines { transition: opacity .18s ease; }\n#m-koffi.flipped #kf-tagNum { transform: scaleX(-1); } /* counter-flip: glyphs never mirror */\n#m-koffi.tag-num #kf-tagNum { opacity: 1; }\n#m-koffi.tag-num #kf-tagLines { opacity: 0; }\n\n  /* stamp rig sits above Koffi, slides along --sx/--sy to the target sticker slot */\n#kf-stampAnim { opacity: 0; transform-origin: 32px 45.5px; }\n#kf-stamp, #kf-puffS { transform: translate(var(--sx, 0px), var(--sy, 0px)); }\n\n  /* stamped stickers: hidden until earned, then persist for the session */\n#m-koffi .stk { opacity: 0; transform       'stamping', 'stamp-hit', 'visa-num', 'puffG', 'puffV', 'visa-b1', 'visa-b2', 'visa-b3', 'visa-b4',

      edgeSnap: 34,
      // a touch quicker than the suitcase in every mood; lightest of the family
      speed: { chill: 30, soon: 43, hype: 68, live: 37 },
      step:  { chill: '0.64s', soon: '0.5s', hype: '0.34s', live: '0.58s' },
      waveEveryMs: 80000,
      dur: {
        walk: [2400, 6800], idle: [1400, 3200], sit: [3000, 7000], sleep: [6500, 12000],
        stretch: [1750, 1750], wave: [2100, 2100], jump: [1100, 1100], peek: [2000, 3400],
        riffle: [3050, 3050], visastamp: [3650, 3650], gaze: [3900, 3900],

        chill: { walk: 5, idle: 4,   sit: 3,   gaze: 2.2, wave: .7,  jump: .6,  peek: 1.2, riffle: 1.2, ribbonchase: .5,  glide: .3,  visastamp: .35, inspection: .45 },
        soon:  { walk: 6, idle: 3,   sit: 1.6, gaze: 1.6, wave: 1,   jump: 1.8, peek: 1.2, riffle: 1.5, ribbonchase: .7,  glide: .45, visastamp: .4,  inspection: .5 },
        hype:  { walk: 7, idle: 1.3, sit: .4,  gaze: .7,  wave: 2,   jump: 3.6, peek: 1.2, riffle: 2.1, ribbonchase: 1.1, glide: .6,  visastamp: 1,   inspection: .35 },
        live:  { walk: 5, idle: 3,   sit: 2.2, gaze: 1.4, wave: 1.2, jump: 1.3, peek: 1,   riffle: 1.3, ribbonchase: .8,  glide: 1.15, visastamp: .5, inspection: .6 }

    _slots: [[-5.5, -6], [5, -7], [-6, 5], [5.5, 6]],

    onTurn: function (k) { k.pulse('flutter', 640); },  // ribbon flutters on turn-around
    onGlideTuck: function (k) { puffGround(k); k.pulse('flare', 700); }, // paper settles after landing
    filterWeights: function (k, w) {
      // a real countdown makes stamping extra tempting
      if (k.mood === 'hype' && k.tripDays != null) w.visastamp = (w.visastamp || 0) + 1.1;
    },
    moodFromTrip: function (days, ongoing) {
      if (ongoing === true) return 'live';
      if (days !== null && days >= 0 && days <= 7) return 'hype';
      if (days !== null && days > 7 && days <= 14) return 'soon';
      return 'chill';
    },
    onMood: function (k, m, changed) {
      if (m === 'live') {
        if (!k._arrived) {
          k._arrived = true;
          setTimeout(function () { if (k._arrived) k.addC('arrived-on'); }, 700);
        }
      } else if (k._arrived) {
        k._arrived = false;
        k.remC('arrived-on');
      }
      if (changed && m === 'hype' && !TrekMascots.reduced && (k.state === 'sleep' || k.state === 'sit')) {
        k.setState(k.state === 'sleep' ? 'stretch' : 'jump');
      }
    },
    // always-on paper rustle; the closer the trip, the twitchier the pages
    ambient: function (k) {
      (function rustle() {
        var span = k.mood === 'soon' ? [6000, 11000] : k.mood === 'hype' ? [8000, 14000] : [16000, 30000];
        setTimeout(function () {
          if (k.dead) return;
          if (k.state !== 'sleep') k.pulse('flare', 700);
          rustle();
        }, TrekMascots.rand(span[0], span[1]));
      })();
    },

    enter: {
      walk: function (k) { if (Math.random() < .3) k.setDir(-k.dir); },
      idle: function (k) {
        if (Math.random() < .8) k.later(function () {
          k.addC(Math.random() < .5 ? 'look-l' : 'look-r');
          k.later(function () { k.remC('look-l'); k.remC('look-r'); }, k.rand(500, 900));
        }, k.rand(300, 1200));
        if (Math.random() < .5) k.later(function () { twitchRibbon(k); }, k.rand(600, 1800));
      },
      sit: function (k) {
        k.addC('pose-sit');
        if (Math.random() < .6) k.later(function () { twitchRibbon(k); }, k.rand(1000, 3000));
      },
      sleep: function () {},  // st-sleep owns the whole lie-down; nothing to add
      stretch: function (k) { k.addC('eyes-closed'); k.later(function () { k.remC('eyes-closed'); }, 650); },
      wave: function (k) {
        k.lastWave = performance.now();
        k.later(function () { k.addC('squint'); }, 450);
        k.later(function () { k.remC('squint'); }, 1550);
      },
      jump: function (k) {
        k.later(function () { k.addC('squint'); }, 300);
        k.later(function () { k.pulse('flare', 600); }, 400);   // pages flutter at apex
        k.later(function () { k.remC('squint'); }, 700);
        k.later(function () { puffGround(k); }, 810);           // dust on landing
        if (k.mood === 'hype') k.later(function () { k.pulse('dusty', 800); }, 830);
      },
      peek: function (k) {
        k.setDir(k.x - k.minX < k.maxX - k.x ? -1 : 1);
        k.later(function () { k.addC('look-down'); }, 380);
      },
      // signature move: the Riffle — thumb-fans every page, snaps shut, hops
      riffle: function (k) {
        k.later(function () { k.addC('cover-open'); }, 150);
        k.later(function () { k.addC('look-down'); }, 420);
        k.later(function () { k.addC('riffling'); }, 620);
        k.later(function () { k.pulse('dusty', 800); }, 760);
        k.later(function () { k.pulse('dusty', 800); }, 1450);
        k.later(function () { k.remC('riffling'); }, 1980);
        k.later(function () { k.remC('look-down'); k.remC('cover-open'); }, 2120);
        k.later(function () { k.pulse('snap', 520); puffGround(k); }, 2200);
        k.later(function () { k.addC('squint'); k.pulse('hop', 500); }, 2320);
        k.later(function () { k.remC('squint'); }, 2950);
      },
      // border control, self-service: opens flat and stamps his own visa page
      visastamp: function (k) {
        var count = k._visas || 0;
        var n = count < 4 ? count + 1 : 1 + Math.floor(Math.random() * 4);
        var slot = TrekMascots.get('passi')._slots[n - 1];
        k.el.style.setProperty('--sx', slot[0] + 'px');
        k.el.style.setProperty('--sy', slot[1] + 'px');
        var showDays = k.mood === 'hype' && k.tripDays != null;
        k.later(function () { k.addC('cover-open'); }, 140);
        k.later(function () { k.addC('stamping'); }, 420);
        k.later(function () { k.addC('look-up'); }, 520);
        k.later(function () {                            // impact frame
          k.remC('look-up');
          k.addC('stamp-hit');
          k.pulse('puffV');
          if (count < 4) { k.addC('visa-on-' + n); k._visas = count + 1; }
          else { k.addC('visa-b' + n); k.later(function () { k.remC('visa-b' + n); }, 700); }
          if (showDays) {
            var num = k.el.querySelector('#pp-visaNum');
            if (num) num.textContent = String(TrekMascots.clamp(Math.round(k.tripDays), 0, 99));
            k.addC('visa-num');
          }
        }, 1300);
        k.later(function () { k.remC('stamp-hit'); k.remC('puffV'); }, 1950);
        k.later(function () { k.addC('look-down'); }, 2250);  // admire the fresh ink
        k.later(function () { k.addC('squint'); }, 2500);
        k.later(function () { k.pulse('hop', 500); }, 2750);
        k.later(function () { k.remC('cover-open'); }, 3050);
        k.later(function () { k.pulse('snap', 520); }, 3100);
        k.later(function () { k.remC('squint'); k.remC('look-down'); }, 3350);
      },
      // reads his own visas like a photo album
      gaze: function (k) {
        k.later(function () { k.addC('cover-open'); }, 200);
        k.later(function () { k.addC('look-down'); }, 520);
        k.later(function () { k.addC('squint'); }, 1500);
        k.later(function () { k.remC('squint'); }, 2300);
        k.later(function () { k.pulse('sigh', 750); }, 2700);  // content exhale
        k.later(function () { k.remC('look-down'); }, 3350);
        k.later(function () { k.remC('cover-open'); }, 3550);
      },
      // glide mode: covers half-open as wings, lean forward and sail
      glide: function (k) {
        k.setDir(k.x - k.minX < k.maxX - k.x ? 1 : -1);  // glide toward the long side
        k.forceNext = 'walk';                            // always resume walking after
        k.glideTucked = false;
        k.addC('glide-out');
        k.later(function () { k.glideMoving = true; k.addC('gliding'); }, 430);
        k.later(function () {                            // catch an imaginary updraft
          if (k.glideMoving) k.pulse('hop', 500);
        }, k.rand(1500, 2700));
        k.later(function () { k.tuckGlide(); }, 3550);   // fold up, paper settles
      },
      // chases his own bookmark like a puppy; ends dizzy and embarrassed
      ribbonchase: function (k) {
        k.later(function () { k.addC('look-l'); }, 150);
        k.later(function () { puffGround(k); }, 250);
        k.later(function () { k.remC('look-l'); puffGround(k); }, 1950);  // skid stop
        k.later(function () { k.addC('dizzy'); }, 2100);
        k.later(function () { k.remC('dizzy'); }, 3080);
      },
      // passport control: stands VERY straight, holds breath under the scanner
      inspection: function (k) {
        k.later(function () { k.addC('rigid'); }, 150);
        k.later(function () { k.addC('scanning'); }, 600);
        k.later(function () {                            // cleared. breathe again
          k.remC('scanning');
          k.remC('rigid');
          k.addC('phew');
          k.addC('eyes-closed');
          k.pulse('sweat', 1100);
        }, 2550);
        k.later(function () { k.pulse('sigh', 750); }, 2900);
        k.later(function () { k.remC('eyes-closed'); }, 3150);
        k.later(function () { k.remC('phew'); }, 3550);
      }
    }
  });
})();

        k.later(function () { k.remC('look-l'); k.addC('look-r'); }, 1320);
        k.later(function () { k.remC('look-r'); }, 1650);
        k.later(function () { k.addC('eyes-closed'); }, 1720);  // effort
        k.later(function () { k.remC('eyes-closed'); }, 2700);
        k.later(function () { k.addC('blush-deep'); }, 3650);   // nobody saw that
        k.later(function () { k.addC('look-r'); }, 3850);
        k.later(function () { k.remC('look-r'); k.addC('look-l'); }, 4250);
      },
      cloudgaze: function (k) {
        k.later(function () { k.addC('look-up'); }, 250);
        k.later(function () { k.addC('squint'); }, 2700);
        k.later(function () { k.remC('squint'); k.remC('look-up'); }, 3850);
      },
      grumble: function (k) {
        k.later(function () { k.addC('brows-knit'); }, 120);
        k.later(function () { k.addC('look-l'); }, 420);
        k.later(function () { k.remC('look-l'); k.addC('look-r'); }, 920);
        k.later(function () { k.remC('look-r'); }, 1360);
        k.later(function () { k.remC('brows-knit'); k.addC('eyes-closed'); }, 1750); // the resigned sigh
        k.later(function () { k.remC('eyes-closed'); }, 2620);
      },
      snuggle: function (k) {
        k.addC('squint');
        if (Math.random() < .5) k.later(function () { twitchStrap(k); }, k.rand(1500, 3000));
      }
    }
  });
})();
</script>

<script>
// Duet director — choreographs two mascots sharing the strip. The engine keeps
// both fully autonomous; every 1.5–4 minutes the director waits for a calm
// moment, freezes both FSMs (hold), plays one scene start-to-finish and hands
// control back (release). Scenes are built ONLY from the shared contract
// classes (wave/hop/squint/look-*) plus a few character-specific states, so a
// missing partner ability simply removes the scene from the deck.
(function () {
  'use strict';

  var rand = TrekMascots.rand;

  // states we may interrupt to start a scene — never mid-air, mid-roll, mid-stamp
  var CALM = { idle: 1, walk: 1, sit: 1 };

  function has(k, state) { return !!k.def.enter[state] || k.def.stateClasses.indexOf('st-' + state) >= 0; }
  function byId(a, b, id) { return a.def.id === id ? a : (b.def.id === id ? b : null); }

  function spark(stageFx, x, glyph) {
    var s = document.createElement('span');
    s.textContent = glyph || '✦';
    s.style.left = Math.round(x) + 'px';
    stageFx.appendChild(s);
    setTimeout(function () { if (s.parentNode) s.parentNode.removeChild(s); }, 1100);
  }

  /** walk both to a shared spot, facing each other; done() once both arrive */
  function meet(a, b, gap, done) {
    var left = a.x <= b.x ? a : b;
    var right = left === a ? b : a;
    var mid = (a.x + b.x) / 2;
    var lo = Math.max(a.minX, Math.min(a.maxX, mid - gap / 2));
    var hi = Math.max(b.minX, Math.min(b.maxX, mid + gap / 2));
    var todo = 2;
    function arrived() { if (--todo === 0) done(); }
    left.walkTo(lo, function () { left.play('idle', { skipEnter: true }); left.setDir(1); arrived(); });
    right.walkTo(hi, function () { right.play('idle', { skipEnter: true }); right.setDir(-1); arrived(); });
  }

  var SCENES = {
    // both raise a limb, a sparkle pops between them
    highfive: {
      eligible: function () { return true; },
      run: function (a, b, fx, done) {
        meet(a, b, 54, function () {
          a.play('wave'); b.play('wave');
          setTimeout(function () { spark(fx, (a.x + b.x) / 2 + 30); }, 650);
          setTimeout(function () { a.pulse('hop', 470); b.pulse('hop', 470); }, 1400);
          setTimeout(done, 2400);
        });
      }
    },

    // side by side, greeting the traveler in near-sync
    syncwave: {
      eligible: function () { return true; },
      run: function (a, b, fx, done) {
        meet(a, b, 88, function () {
          a.setDir(1); b.setDir(1);
          a.play('wave');
          setTimeout(function () { b.play('wave'); }, 180);
          setTimeout(done, 2400);
        });
      }
    },

    // one playful lap across the strip, both hop at the end
    chase: {
      eligible: function (a, b) { return a.maxX - a.minX > 160; },
      run: function (a, b, fx, done) {
        var runner = Math.random() < .5 ? a : b;
        var chaser = runner === a ? b : a;
        var goal = runner.x - runner.minX < runner.maxX - runner.x ? runner.maxX : runner.minX;
        runner.walkTo(goal, function () { runner.play('idle', { skipEnter: true }); });
        setTimeout(function () {
          chaser.walkTo(goal < chaser.x ? goal + 40 : goal - 40, function () {
            chaser.play('idle', { skipEnter: true });
            runner.pulse('hop', 470); chaser.pulse('hop', 470);
            runner.setDir(chaser.x < runner.x ? -1 : 1);
            chaser.setDir(runner.x < chaser.x ? -1 : 1);
            setTimeout(done, 800);
          });
        }, 350);
      }
    },

    // Passi officiates: Koffi gets a fresh passport-control sticker
    stampgift: {
      eligible: function (a, b) { return byId(a, b, 'passi') && byId(a, b, 'koffi'); },
      run: function (a, b, fx, done) {
        var passi = byId(a, b, 'passi'), koffi = byId(a, b, 'koffi');
        meet(a, b, 60, function () {
          passi.addC('look-up');
          passi.pulse('hop', 470);
          koffi.play('stamp');
          setTimeout(function () { spark(fx, koffi.x + 36, '★'); }, 1100);
          setTimeout(function () { passi.remC('look-up'); passi.addC('squint'); }, 2100);
          setTimeout(function () { passi.remC('squint'); done(); }, 3400);
        });
      }
    },

    // Puffi climbs aboard and naps while Koffi glides the trolley across
    napride: {
      eligible: function (a, b) { return byId(a, b, 'puffi') && byId(a, b, 'koffi'); },
      run: function (a, b, fx, done) {
        var puffi = byId(a, b, 'puffi'), koffi = byId(a, b, 'koffi');
        if (koffi.maxX - koffi.minX < 150) { done(); return; }
        meet(a, b, 44, function () {
          puffi.pulse('hop', 470);
          setTimeout(function () {
            var jumper = puffi.el.querySelector('.jumper');
            if (jumper) jumper.style.bottom = '44px';   // hop onto the lid
            puffi.play('sleep');
            koffi.play('roll');                          // enter.roll drives the glide + self-tucks
          }, 500);
          var follow = setInterval(function () {         // ride shotgun on the suitcase
            puffi.x = TrekMascots.clamp(koffi.x + 3, puffi.minX, puffi.maxX);
          }, 40);
          setTimeout(function () {
            clearInterval(follow);
            var jumper = puffi.el.querySelector('.jumper');
            if (jumper) jumper.style.bottom = '';
            puffi.play('stretch');
            setTimeout(done, 1300);
          }, 4600);
        });
      }
    },

    // Chiki shares the warm steam; the partner leans in and basks
    steamshare: {
      eligible: function (a, b) { return byId(a, b, 'chiki'); },
      run: function (a, b, fx, done) {
        var chiki = byId(a, b, 'chiki');
        var pal = chiki === a ? b : a;
        meet(a, b, 48, function () {
          chiki.play(has(chiki, 'steam') ? 'steam' : 'idle');
          pal.addC(pal.x < chiki.x ? 'look-r' : 'look-l');
          setTimeout(function () { pal.addC('squint'); }, 900);
          setTimeout(function () { spark(fx, (a.x + b.x) / 2 + 30, '♥'); }, 1300);
          setTimeout(function () {
            pal.remC('look-l'); pal.remC('look-r'); pal.remC('squint');
            done();
          }, 3000);
        });
      }
    },

    // Chiki vanishes into the pouch; the partner searches, Chiki pops back out
    peekaboo: {
      eligible: function (a, b) { var c = byId(a, b, 'chiki'); return c && has(c, 'duck'); },
      run: function (a, b, fx, done) {
        var chiki = byId(a, b, 'chiki');
        var pal = chiki === a ? b : a;
        meet(a, b, 58, function () {
          chiki.play('duck');
          setTimeout(function () { pal.addC('look-l'); }, 500);
          setTimeout(function () { pal.remC('look-l'); pal.addC('look-r'); }, 1150);
          setTimeout(function () { pal.remC('look-r'); }, 1800);
          setTimeout(function () { pal.pulse('hop', 470); pal.addC('squint'); }, 2350);
          setTimeout(function () { pal.remC('squint'); done(); }, 3300);
        });
      }
    }
  };

  function Director(a, b, stage) {
    this.a = a;
    this.b = b;
    this.fx = document.getElementById('stage-fx');
    this.busy = false;
    this.stopped = false;
    this.glanceAt = performance.now() + rand(18000, 36000);
    this.sceneAt = performance.now() + rand(25000, 60000);
  }

  Director.prototype = {
    stop: function () { this.stopped = true; },

    calm: function () {
      return CALM[this.a.state] && CALM[this.b.state] && !this.a.paused && !this.b.paused;
    },

    tick: function () {
      if (this.stopped || this.busy) return;
      var now = performance.now();

      // ambient awareness: a brief glance across the strip
      if (now > this.glanceAt) {
        this.glanceAt = now + rand(20000, 42000);
        if (this.calm() && Math.abs(this.a.x - this.b.x) > 40) {
          var g = Math.random() < .5 ? this.a : this.b;
          var o = g === this.a ? this.b : this.a;
          g.addC(o.x < g.x ? 'look-l' : 'look-r');
          setTimeout(function () { g.remC('look-l'); g.remC('look-r'); }, rand(600, 1100));
        }
      }

      if (now > this.sceneAt) {
        if (!this.calm()) { this.sceneAt = now + 8000; return; } // wait out the nap/roll/stamp
        this.playScene();
      }
    },

    playScene: function () {
      var deck = [], k;
      for (k in SCENES) if (SCENES[k].eligible(this.a, this.b)) deck.push(k);
      if (!deck.length) { this.sceneAt = performance.now() + 120000; return; }
      var name = deck[Math.floor(Math.random() * deck.length)];
      var self = this;
      this.busy = true;
      this.a.hold(); this.b.hold();
      var guard = setTimeout(finish, 12000); // a stuck scene must never freeze the strip
      function finish() {
        clearTimeout(guard);
        if (!self.busy) return;
        self.busy = false;
        self.sceneAt = performance.now() + rand(90000, 240000);
        self.a.release(); self.b.release();
      }
      try {
        SCENES[name].run(this.a, this.b, this.fx, finish);
      } catch (e) {
        finish();
      }
    }
  };

  window.TrekDirector = {
    start: function (a, b, stage) { return new Director(a, b, stage); }
  };
})();
</script>

<script>
(function () {
  'use strict';

  var CONFIG = {
    edgePad: 6,
    pollMs: 600000,        // trip mood refresh
    mascotPollMs: 45000,   // picks changed in settings show up without a reload
    invokeTimeoutMs: 15000
  };

  var stage = document.getElementById('stage');
  var runtimes = [];
  var active = ['koffi'];
  var ctx = null, seq = 0, pending = {};
  var lastTrip = { days: null, ongoing: false };
  var director = null;

  function laneMax(def) { return Math.max(CONFIG.edgePad, window.innerWidth - def.width - CONFIG.edgePad); }

  function spawn(ids) {
    if (director) { director.stop(); director = null; }
    for (var i = 0; i < runtimes.length; i++) runtimes[i].destroy();
    runtimes = [];
    for (var j = 0; j < ids.length && j < 2; j++) {
      var def = TrekMascots.get(ids[j]);
      if (!def) continue;
      var k = new TrekMascots.Runtime(def, stage);
      k.el.style.zIndex = String(2 - j); // first pick walks in front
      k.boot(CONFIG.edgePad, laneMax(def));
      k.applyTrip(lastTrip.days, lastTrip.ongoing);
      runtimes.push(k);
    }
    if (runtimes.length === 2 && !TrekMascots.reduced && window.TrekDirector) {
      director = TrekDirector.start(runtimes[0], runtimes[1], stage);
    }
  }

  window.addEventListener('resize', function () {
    for (var i = 0; i < runtimes.length; i++) runtimes[i].setLane(CONFIG.edgePad, laneMax(runtimes[i].def));
  });

  (function frame(t) {
    for (var i = 0; i < runtimes.length; i++) runtimes[i].tick(t || performance.now());
    if (director) director.tick();
    if (!TrekMascots.reduced) requestAnimationFrame(frame);
  })(performance.now());

  /* ---- trekBridge ---- */
  function post(msg) { try { if (window.parent) window.parent.postMessage(msg, '*'); } catch (e) {} }

  function requestState() {
    var id = 'mascots-' + (++seq) + '-' + Date.now().toString(36);
    pending[id] = true;
    setTimeout(function () { delete pending[id]; }, CONFIG.invokeTimeoutMs);
    var sub = '/state' + (ctx && ctx.tripId != null && ctx.tripId !== '' ? '?tripId=' + ctx.tripId : '');
    post({ type: 'trek:invoke', requestId: id, sub: sub, method: 'GET' });
  }

  function sameIds(a, b) {
    if (a.length !== b.length) return false;
    for (var i = 0; i < a.length; i++) if (a[i] !== b[i]) return false;
    return true;
  }

  function applyState(d) {
    if (!d || typeof d !== 'object') return;
    lastTrip.days = (typeof d.days === 'number' && isFinite(d.days)) ? d.days : null;
    lastTrip.ongoing = d.ongoing === true;
    var picks = Array.isArray(d.mascots) && d.mascots.length ? d.mascots.slice(0, 2) : ['koffi'];
    if (!runtimes.length || !sameIds(picks, active)) {
      active = picks;
      spawn(active);
    } else {
      for (var i = 0; i < runtimes.length; i++) runtimes[i].applyTrip(lastTrip.days, lastTrip.ongoing);
    }
  }

  window.addEventListener('message', function (e) {
    var m = e && e.data;
    if (!m || typeof m !== 'object') return;
    if (m.type === 'trek:context') {
      ctx = m;
      requestState();
    } else if (m.type === 'trek:response' && pending[m.requestId]) {
      delete pending[m.requestId];
      applyState(m.data);
    } else if (m.type === 'trek:error' && pending[m.requestId]) {
      delete pending[m.requestId];
    } else if (m.type === 'trek:event' && typeof m.event === 'string' && m.event.indexOf('mascots') >= 0) {
      requestState(); // a planner-side save reached us live; dashboards rely on the poll
    }
  });

  setInterval(requestState, CONFIG.pollMs);
  setInterval(function () { if (document.visibilityState !== 'hidden') requestState(); }, CONFIG.mascotPollMs);
  post({ type: 'trek:ready' });

  spawn(active); // Koffi appears immediately; the first /state may re-cast
})();
</script>
