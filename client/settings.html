<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Koffi &amp; Friends — pick your crew</title>
<style>
  :root {
    --bg-card: #1F2937;
    --bg-tile: #111827;
    --text: #F9FAFB;
    --text-muted: #9CA3AF;
    --edge: #374151;
    --accent: #4F46E5;
    --accent-soft: rgba(79, 70, 229, .16);
  }
  html, body { margin: 0; padding: 0; background: transparent; }
  body {
    font-family: -apple-system, "Segoe UI", Roboto, "Helvetica Neue", sans-serif;
    color: var(--text);
    font-size: 13px;
  }

  .head { display: flex; align-items: baseline; gap: 10px; margin: 2px 2px 10px; }
  .head h3 { margin: 0; font-size: 14px; font-weight: 700; }
  .head span { color: var(--text-muted); font-size: 12px; }
  .duo-badge {
    margin-left: auto; padding: 2px 9px; border-radius: 999px;
    background: var(--accent-soft); color: #A5B4FC;
    font-size: 11px; font-weight: 600; letter-spacing: .02em;
    opacity: 0; transition: opacity .2s ease;
  }
  .duo-badge.on { opacity: 1; }

  .tiles {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
    gap: 10px;
  }

  .tile {
    position: relative;
    border: 1px solid var(--edge);
    border-radius: 12px;
    background: var(--bg-tile);
    cursor: pointer;
    padding: 0 0 10px;
    text-align: left;
    font-family: inherit;
    color: inherit;
    overflow: hidden;
    transition: border-color .18s ease, box-shadow .18s ease, transform .18s ease;
  }
  .tile:hover { transform: translateY(-1px); border-color: #4B5563; }
  .tile.active { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent), 0 6px 18px rgba(79,70,229,.25); }
  .tile:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .tile.deny { animation: tileDeny .3s ease; }
  @keyframes tileDeny { 0%,100% { transform: translateX(0); } 30% { transform: translateX(-4px); } 65% { transform: translateX(4px); } }

  /* mini hero: the boarding-pass indigo with the dotted flight path */
  .stagelet {
    position: relative;
    height: 108px;
    background: linear-gradient(135deg, #4338CA 0%, #4F46E5 55%, #6366F1 100%);
    overflow: hidden;
  }
  .stagelet svg.path { position: absolute; top: 12px; left: 0; width: 100%; opacity: .5; }
  .stagelet .mascot { pointer-events: none; }

  .meta { padding: 9px 12px 0; }
  .meta .name { font-weight: 700; font-size: 13px; display: flex; align-items: center; gap: 7px; }
  .meta .tagline { color: var(--text-muted); font-size: 11.5px; margin-top: 2px; line-height: 1.35; }

  .badge {
    position: absolute; top: 8px; right: 8px; z-index: 3;
    width: 20px; height: 20px; border-radius: 999px;
    background: var(--accent); color: #fff;
    display: none; align-items: center; justify-content: center;
    box-shadow: 0 2px 6px rgba(2,6,23,.4);
  }
  .tile.active .badge { display: flex; }
  .badge svg { width: 11px; height: 11px; }

  .foot { margin: 10px 2px 0; color: var(--text-muted); font-size: 11.5px; min-height: 15px; }
  .foot.saved { color: #6EE7B7; }
  .foot.error { color: #FCA5A5; }
</style>
</head>
<body>

<div class="head">
  <h3>Mascots</h3>
  <span>pick one — or a duo, they get along</span>
  <span class="duo-badge" id="duoBadge">Duo active</span>
</div>
<div class="tiles" id="tiles"></div>
<div class="foot" id="foot"></div>

<script src="engine.js"></script>
<script src="characters/koffi.js"></script>
<script src="characters/chiki.js"></script>
<script src="characters/passi.js"></script>
<script src="characters/puffi.js"></script>
<script>
(function () {
  'use strict';

  var ORDER = ['koffi', 'chiki', 'passi', 'puffi'];
  var reduced = TrekMascots.reduced;
  var tilesEl = document.getElementById('tiles');
  var footEl = document.getElementById('foot');
  var duoBadge = document.getElementById('duoBadge');

  var picks = ['koffi'];
  var previews = {};
  var seq = 0, pending = {};

  var PATH_SVG = '<svg class="path" viewBox="0 0 160 24" preserveAspectRatio="none">' +
    '<path d="M4,20 Q80,-6 156,14" fill="none" stroke="#E0E7FF" stroke-width="1.2" stroke-dasharray="1 5" stroke-linecap="round"/>' +
    '<circle cx="4" cy="20" r="1.6" fill="#E0E7FF"/><circle cx="156" cy="14" r="1.6" fill="#E0E7FF"/></svg>';
  var CHECK_SVG = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6L9 17l-5-5"/></svg>';

  function post(msg) { try { if (window.parent) window.parent.postMessage(msg, '*'); } catch (e) {} }
  function invoke(sub, method, body, cb) {
    var id = 'picker-' + (++seq) + '-' + Date.now().toString(36);
    pending[id] = cb || function () {};
    setTimeout(function () { if (pending[id]) { pending[id](null); delete pending[id]; } }, 12000);
    var msg = { type: 'trek:invoke', requestId: id, sub: sub, method: method || 'GET' };
    if (body) msg.body = body;
    post(msg);
  }

  window.addEventListener('message', function (e) {
    var m = e && e.data;
    if (!m || typeof m !== 'object') return;
    if (m.type === 'trek:context') return;
    if ((m.type === 'trek:response' || m.type === 'trek:error') && pending[m.requestId]) {
      var cb = pending[m.requestId];
      delete pending[m.requestId];
      cb(m.type === 'trek:response' ? m.data : null);
    }
  });

  function renderTiles() {
    for (var i = 0; i < ORDER.length; i++) {
      (function (id) {
        var def = TrekMascots.get(id);
        if (!def) return;
        var tile = document.createElement('button');
        tile.type = 'button';
        tile.className = 'tile';
        tile.setAttribute('data-id', id);
        tile.setAttribute('aria-pressed', 'false');
        tile.innerHTML =
          '<span class="badge">' + CHECK_SVG + '</span>' +
          '<div class="stagelet">' + PATH_SVG + '</div>' +
          '<div class="meta"><div class="name">' + def.name + '</div>' +
          '<div class="tagline">' + def.tagline + '</div></div>';
        tilesEl.appendChild(tile);

        // live preview: the real character, parked mid-tile
        var stagelet = tile.querySelector('.stagelet');
        var k = new TrekMascots.Runtime(def, stagelet);
        previews[id] = k;
        var px = Math.max(0, (150 - def.width) / 2);
        k.setLane(px, px);
        k.x = px;
        k.setDir(1);
        k.setMood(def.moods[0]);
        k.el.style.transform = 'translate3d(' + px + 'px,0,0)';
        k.booted = true;
        k.paused = true; // held: the tile owns what plays, no wandering
        if (reduced) {
          var poses = (def.reducedPose || '').split(' ');
          for (var p = 0; p < poses.length; p++) if (poses[p]) k.addC(poses[p]);
        } else {
          k.play('idle');
          // hover = the signature move, replayable; leave = settle back to idle
          tile.addEventListener('mouseenter', function () { k.play(def.signature); });
          tile.addEventListener('mouseleave', function () { k.play('idle'); });
        }

        tile.addEventListener('click', function () { toggle(id, tile); });
      })(ORDER[i]);
    }
    paint();
  }

  function paint() {
    var tiles = tilesEl.children;
    for (var i = 0; i < tiles.length; i++) {
      var id = tiles[i].getAttribute('data-id');
      var on = picks.indexOf(id) >= 0;
      tiles[i].classList.toggle('active', on);
      tiles[i].setAttribute('aria-pressed', on ? 'true' : 'false');
    }
    duoBadge.classList.toggle('on', picks.length === 2);
  }

  function toggle(id, tile) {
    var at = picks.indexOf(id);
    if (at >= 0) {
      if (picks.length === 1) { tile.classList.remove('deny'); void tile.offsetWidth; tile.classList.add('deny'); return; }
      picks.splice(at, 1);
    } else if (picks.length < 2) {
      picks.push(id);
    } else {
      picks[1] = id; // a full duo swaps its newest member
    }
    paint();
    save();
  }

  var saveTimer = null;
  function save() {
    clearTimeout(saveTimer);
    saveTimer = setTimeout(function () {
      footEl.className = 'foot';
      footEl.textContent = 'Saving…';
      invoke('/mascots', 'POST', { mascots: picks }, function (d) {
        if (d && d.mascots) {
          picks = d.mascots;
          paint();
          footEl.className = 'foot saved';
          footEl.textContent = picks.length === 2
            ? 'Saved — your duo appears on the dashboard within a minute.'
            : 'Saved — appears on the dashboard within a minute.';
        } else {
          footEl.className = 'foot error';
          footEl.textContent = 'Could not save — try again.';
        }
        setTimeout(function () { footEl.textContent = ''; footEl.className = 'foot'; }, 4000);
      });
    }, 250);
  }

  function resize() {
    post({ type: 'trek:resize', height: document.body.scrollHeight + 4 });
  }

  renderTiles();
  invoke('/mascots', 'GET', null, function (d) {
    if (d && Array.isArray(d.mascots) && d.mascots.length) { picks = d.mascots; paint(); }
  });
  post({ type: 'trek:ready' });
  resize();
  window.addEventListener('resize', resize);
  setTimeout(resize, 300);
})();
</script>
</body>
</html>
